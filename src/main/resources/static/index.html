<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Order Processing (RabbitMQ)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #f4f6f9;
            margin: 0;
            padding: 40px 16px;
            color: #1f2937;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin: 0 0 6px;
            font-size: 22px;
            color: #111827;
        }
        p.subtitle {
            margin: 0 0 22px;
            font-size: 14px;
            color: #6b7280;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #374151;
        }
        select, input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }
        .order-id-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .order-id-row input {
            margin-bottom: 0;
            flex: 1;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #1f2937;
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }
        .btn-primary {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .hint {
            font-size: 12px;
            color: #6b7280;
            margin-top: -10px;
            margin-bottom: 16px;
        }
        pre#responseBox {
            margin-top: 20px;
            background: #111827;
            color: #10b981;
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            overflow-x: auto;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>E-Commerce Order Service</h1>
        <p class="subtitle">Place an order to publish an event to RabbitMQ Topic Exchange (<code>orders_exchange</code>)</p>

        <form id="orderForm">
            <label for="category">Item Category</label>
            <select id="category" name="category" required>
                <option value="electronics">electronics (Inventory + Analytics)</option>
                <option value="clothing">clothing (Inventory only)</option>
                <option value="books">books (Inventory only)</option>
            </select>

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" value="1" required />
            <div class="hint">Tip: Enter a negative value (e.g., <code>-5</code>) to test rejection and Dead Letter Exchange (DLX).</div>

            <label for="orderId">Order ID (Optional - leave blank to auto-generate)</label>
            <div class="order-id-row">
                <input type="text" id="orderId" name="orderId" placeholder="Auto-generated unique Order ID" />
                <button type="button" id="reuseOrderIdBtn" class="btn-secondary" disabled>Reuse Last ID</button>
            </div>
            <div class="hint">Tip: Reuse the last Order ID to test Idempotency handling in consumers.</div>

            <button type="submit" class="btn-primary">Place Order</button>
        </form>

        <pre id="responseBox"></pre>
    </div>

    <script>
        const form = document.getElementById("orderForm");
        const responseBox = document.getElementById("responseBox");
        const orderIdInput = document.getElementById("orderId");
        const reuseBtn = document.getElementById("reuseOrderIdBtn");
        let lastOrderId = null;

        reuseBtn.addEventListener("click", () => {
            if (lastOrderId) {
                orderIdInput.value = lastOrderId;
            }
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const category = document.getElementById("category").value;
            const quantity = parseInt(document.getElementById("quantity").value, 10);
            const customOrderId = orderIdInput.value.trim();

            const payload = { category, quantity };
            if (customOrderId) {
                payload.orderId = customOrderId;
            }

            try {
                const res = await fetch("/api/orders", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.order_id) {
                    lastOrderId = data.order_id;
                    reuseBtn.disabled = false;
                }

                responseBox.style.display = "block";
                responseBox.style.color = res.ok ? "#10b981" : "#f87171";
                responseBox.textContent = JSON.stringify(data, null, 2);
                orderIdInput.value = "";
            } catch (err) {
                responseBox.style.display = "block";
                responseBox.style.color = "#f87171";
                responseBox.textContent = "Request failed: " + err.message;
            }
        });
    </script>
</body>
</html>
